<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Julia Plourde — Échantillons de Terrain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Libre+Baskerville&family=Inter:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fff;
      --ink: #1d71b8;
      --muted: #1d71b8;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, sans-serif;
    }

    /* Vladimir Script and Bookman Old Style are licensed Microsoft fonts that can't be served from
       here, so visitors without them installed get the closest Google Fonts lookalike. */

    /* Landing */
    .hero {
      height: 100vh;
      height: 100svh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 16px;
    }
    .hero h1 {
      font-family: "Vladimir Script", "Great Vibes", cursive;
      font-weight: 400;
      font-size: clamp(3rem, 12vw, 9rem);
      letter-spacing: 0;
      line-height: 1;
      animation: rise 1.2s cubic-bezier(.2,.7,.2,1) both;
    }
    .hero p {
      margin-top: 1.25rem;
      color: var(--muted);
      font-family: "Bookman Old Style", "Bookman", "Libre Baskerville", serif;
      font-size: 0.8rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      animation: rise 1.2s .3s cubic-bezier(.2,.7,.2,1) both;
    }
    .scroll-hint {
      position: absolute;
      bottom: 32px;
      left: 50%;
      width: 1px;
      height: 48px;
      background: var(--muted);
      transform-origin: top;
      animation: hint 2s ease-in-out infinite;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes hint {
      0%   { transform: scaleY(0); }
      50%  { transform: scaleY(1); }
      100% { transform: scaleY(0); transform-origin: bottom; }
    }

    /* Stacked gallery: every card sticks to the top, so the next one slides over it. */
    .stack { position: relative; }
    .card {
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100svh;
      display: grid;
      place-items: center;
      padding: 6vh 16px;
      background: var(--bg);
    }
    .card figure {
      max-width: 1100px;
      padding: 16px;
      background: #fff;
      transform-origin: center top;
      will-change: transform;
    }
    /* Cap the artwork by the window height too (minus card padding, sheet padding and caption),
       so short windows shrink it instead of cutting off the bottom. */
    .card img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: calc(88vh - 76px);
      max-height: calc(88svh - 76px);
    }
    .card figcaption {
      display: flex;
      justify-content: flex-end;
      gap: 16px;
      padding: 14px 4px 0;
      font-size: 0.8rem;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div>
      <h1>Julia Plourde</h1>
      <p>Échantillons de Terrain</p>
    </div>
    <span class="scroll-hint" aria-hidden="true"></span>
  </header>

  <main class="stack">
    <section class="card"><figure>
      <img src="images/DES800A_PLOURDEJ_TP32.jpg" alt="Julia Plourde, planche 1">
      <figcaption><span>01 / 15</span></figcaption>
    </figure></section>
    <section class="card"><figure>
      <img src="images/DES800A_PLOURDEJ_TP33.jpg" alt="Julia Plourde, planche 2">
      <figcaption><span>02 / 15</span></figcaption>
    </figure></section>
    <section class="card"><figure>
      <img src="images/DES800A_PLOURDEJ_TP34.jpg" alt="Julia Plourde, planche 3" loading="lazy">
      <figcaption><span>03 / 15</span></figcaption>
    </figure></section>
    <section class="card"><figure>
      <img src="images/DES800A_PLOURDEJ_TP35.jpg" alt="Julia Plourde, planche 4" loading="lazy">
      <figcaption><span>04 / 15</span></figcaption>
    </figure></section>
    <section class="card"><figure>
      <img src="images/DES800A_PLOURDEJ_TP36.jpg" alt="Julia Plourde, planche 5" loading="lazy">
      <figcaption><span>05 / 15</span></figcaption>
    </figure></section>
    <section class="card"><figure>
      <img src="images/DES800A_PLOURDEJ_TP37.jpg" alt="Julia Plourde, planche 6" loading="lazy">
      <figcaption><span>06 / 15</span></figcaption>
    </figure></section>
    <section class="card"><figure>
      <img src="images/DES800A_PLOURDEJ_TP38.jpg" alt="Julia Plourde, planche 7" loading="lazy">
      <figcaption><span>07 / 15</span></figcaption>
    </figure></section>
    <section class="card"><figure>
      <img src="images/DES800A_PLOURDEJ_TP39.jpg" alt="Julia Plourde, planche 8" loading="lazy">
      <figcaption><span>08 / 15</span></figcaption>
    </figure></section>
    <section class="card"><figure>
      <img src="images/DES800A_PLOURDEJ_TP310.jpg" alt="Julia Plourde, planche 9" loading="lazy">
      <figcaption><span>09 / 15</span></figcaption>
    </figure></section>
    <section class="card"><figure>
      <img src="images/DES800A_PLOURDEJ_TP311.jpg" alt="Julia Plourde, planche 10" loading="lazy">
      <figcaption><span>10 / 15</span></figcaption>
    </figure></section>
    <section class="card"><figure>
      <img src="images/DES800A_PLOURDEJ_TP312.jpg" alt="Julia Plourde, planche 11" loading="lazy">
      <figcaption><span>11 / 15</span></figcaption>
    </figure></section>
    <section class="card"><figure>
      <img src="images/DES800A_PLOURDEJ_TP313.jpg" alt="Julia Plourde, planche 12" loading="lazy">
      <figcaption><span>12 / 15</span></figcaption>
    </figure></section>
    <section class="card"><figure>
      <img src="images/DES800A_PLOURDEJ_TP314.jpg" alt="Julia Plourde, planche 13" loading="lazy">
      <figcaption><span>13 / 15</span></figcaption>
    </figure></section>
    <section class="card"><figure>
      <img src="images/DES800A_PLOURDEJ_TP315.jpg" alt="Julia Plourde, planche 14" loading="lazy">
      <figcaption><span>14 / 15</span></figcaption>
    </figure></section>
    <section class="card"><figure>
      <img src="images/DES800A_PLOURDEJ_TP316.jpg" alt="Julia Plourde, planche 15" loading="lazy">
      <figcaption><span>15 / 15</span></figcaption>
    </figure></section>
  </main>


  <script>
    // As the next card slides over a card, shrink the one underneath.
    const figures = [...document.querySelectorAll('.card figure')];
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    function update() {
      const vh = window.innerHeight;
      figures.forEach((fig, i) => {
        const next = figures[i + 1];
        if (!next) return;
        const covered = Math.min(Math.max(1 - next.parentElement.getBoundingClientRect().top / vh, 0), 1);
        fig.style.transform = `scale(${1 - covered * 0.08})`;
      });
    }

    if (!reduceMotion) {
      addEventListener('scroll', () => requestAnimationFrame(update), { passive: true });
      addEventListener('resize', update);
      update();
    }
  </script>
</body>
</html>
